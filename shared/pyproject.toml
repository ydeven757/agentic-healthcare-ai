[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcare-shared"
version = "0.1.0"
description = "Shared utilities for Healthcare AI Agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "reportlab>=4.0.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
packages = ["healthcare_shared"]
